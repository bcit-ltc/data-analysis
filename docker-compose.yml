services:
  spark-master:
    image: spark:latest
    container_name: spark-master
    hostname: spark-master
    ports:
      - "7077:7077"
      - "8080:8080"
      - "4040:4040"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.master.Master
      - --host
      - spark-master
      - --port
      - "7077"
      - --webui-port
      - "8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-worker:
    image: spark:latest
    container_name: spark-worker
    depends_on:
      spark-master:
        condition: service_healthy
    working_dir: /opt/app
    volumes:
      - ./:/opt/app
    ports:
      - "8081:8081"
    entrypoint: ["/opt/spark/bin/spark-class"]
    command:
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --cores
      - "4"
      - --memory
      - "4G"
      - --webui-port
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://spark-master:8080 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  spark-runner:
    image: spark:latest
    container_name: spark-runner
    depends_on:
      spark-master:
        condition: service_healthy
      spark-worker:
        condition: service_healthy
    working_dir: /opt/app
    volumes:
      - ./:/opt/app
    entrypoint:
      - /bin/bash
      - -lc
      - /opt/app/etl.sh
    environment:
      RUN_ETL: "1"